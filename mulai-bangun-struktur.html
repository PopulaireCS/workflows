@media (prefers-reduced-motion: reduce){ .group{transition:none} }
</style>

<script>
const P={SETYO:['#6D3FC0','#fff'],BEN:['#2F7FE0','#fff'],ANDI:['#0E8A8A','#fff'],ADI:['#F07D1A','#1a1000'],AWENG:['#1E7A34','#fff'],ARIEF:['#C62828','#fff'],CYRUS:['#1F2F6B','#fff'],RADHIT:['#8B5A2B','#fff'],OWNER:['#E0458B','#fff'],PENGAWAS:['#E8B81E','#2b2100'],WAKIL:['#F6E3A1','#2b2100'],RIRIN:['#00ACC1','#00262b'],KHOIRUL:['#AD1457','#fff']};

const sc=n=>STROKE[n]||P[n][0];

const GROUPS=[
 {id:'POSBO',name:'PO | SBO',t:'pro',m:['ARIEF','RADHIT','SETYO','AWENG','RIRIN','KHOIRUL','CYRUS'],st:{}},
 {id:'SUBMIT',name:'PO | SUBMIT',t:'pro',m:['PENGAWAS','KHOIRUL','RIRIN','ARIEF','CYRUS'],st:{}},
 {id:'PROJPO',name:'XXX | PO SBO',t:'pro',m:['RIRIN','ARIEF','RADHIT','CYRUS'],st:{}},
 {id:'CLIENT',name:'OWNER GROUP',t:'owner',m:['OWNER','SETYO','ARIEF','RADHIT','CYRUS'],st:{RADHIT:'pas'}},
 {id:'XXX',name:'XXX APPROVED FIN DRAWINGS ONLY',t:'owner',m:['OWNER','ARIEF','CYRUS'],unused:true,st:{CYRUS:'pas'}},
 {id:'ENG',name:'DESAIN | ENGINEERING',t:'desain',m:['BEN','ANDI','SETYO','AWENG','ARIEF','CYRUS']},
 {id:'GAMBAR',name:'DESAIN | GAMBAR',t:'desain',m:['BEN','ADI','SETYO','AWENG','ARIEF','CYRUS'],st:{BEN:'pas',CYRUS:'pas'}},
 {id:'STR',name:'LAPANGAN | STRUKTUR',t:'lap',m:['PENGAWAS','AWENG','ARIEF','KHOIRUL','RADHIT','CYRUS'],st:{RADHIT:'pas'}},
 {id:'FIN',name:'LAPANGAN | FINISHINGS',t:'lap',m:['PENGAWAS','AWENG','ARIEF','KHOIRUL','RADHIT','CYRUS'],st:{RADHIT:'pas'}},
 {id:'REVIEW',name:'PO | REVIEW',t:'pro',m:['RIRIN','ARIEF','CYRUS'],st:{}},
 {id:'PRO',name:'PROYEK XXX',t:'pro',box:true,m:['WAKIL','PENGAWAS','ARIEF','KHOIRUL','RADHIT','CYRUS'],st:{RADHIT:'pas',CYRUS:'pas'}}
];
const TINT={owner:['--t-owner','--t-owner-b'],desain:['--t-desain','--t-desain-b'],lap:['--t-lap','--t-lap-b'],pro:['--t-pro','--t-pro-b']};

const ALL=[
 {who:'CYRUS',title:'Pak CYRUS konfirmasi: lanjut bangun',text:'GO untuk proyek ini, dikirim ke DESAIN | GAMBAR dan LAPANGAN | STRUKTUR, supaya lapangan mulai siapkan tim dan KHOIRUL mulai persiapan pra-lokasi.',roles:{},arrows:[{ext:true,by:'CYRUS',to:'GAMBAR',also:'STR',c:'CYRUS',dash:true,icon:'check'}]},
 {who:'SETYO',title:'Pak SETYO kirim FILE SKP + DENAH ke DESAIN | GAMBAR',text:'File SketchUp dan denah terbaru.',roles:{},arrows:[{doc:'FILE SKP + DENAH',by:'SETYO',to:'GAMBAR',c:'SETYO'}]},
 {who:'BEN',title:'Pak BEN kirim DOKUMEN DESAIN ke DESAIN | ENGINEERING',text:'Untuk Pak ANDI.',roles:{},arrows:[{doc:'DOKUMEN DESAIN',by:'BEN',to:'ENG',c:'BEN'}]},
 {who:'ANDI',title:'Pak ANDI mulai hitungan struktur',text:'',roles:{ENG:{ANDI:'review'}},arrows:[]},
 {who:'ADI',title:'Pak ADI kirim MARKUP AS ke DESAIN | GAMBAR',text:'Markup as (axis) untuk lapangan.',roles:{},arrows:[{doc:'MARKUP AS',by:'ADI',to:'GAMBAR',c:'ADI'}]},
 {who:'SETYO',also:['BEN','AWENG'],title:'Pak SETYO, Pak BEN dan Pak AWENG review',text:'',roles:{GAMBAR:{SETYO:'review',BEN:'review',AWENG:'review'}},arrows:[]},
 {who:'AWENG',title:'Pak AWENG kirim MARKUP AS ke LAPANGAN | STRUKTUR',text:'Setelah disetujui.',roles:{GAMBAR:{AWENG:'out'}},icons:{GAMBAR:{SETYO:'okgreen',BEN:'okgreen',AWENG:'okgreen'}},arrows:[{from:['GAMBAR','AWENG'],to:'STR',c:'AWENG'}]},
 {who:'AWENG',title:'Pak AWENG hadir di markup lapangan',text:'Pak AWENG cek markup di lokasi dan sign off.',roles:{STR:{AWENG:'review'}},arrows:[]},
 {who:'ANDI',title:'Pak ANDI kirim DATA ENGINEERING ke Pak BEN',text:'Langsung ke Pak BEN, supaya gambar kerja struktur bisa mulai.',roles:{ENG:{ANDI:'comm'}},arrows:[{from:['ENG','ANDI'],to:'ENG',toLab:['ENG','BEN'],c:'ANDI',bulge:-60}]},
 {who:'BEN',title:'Pak BEN mulai GAMBAR KERJA STRUKTUR',text:'Lanjut ke alur GAMBAR KERJA | STRUKTUR.',roles:{GAMBAR:{BEN:'comm'}},icons:{STR:{AWENG:'okgreen'}},focus:['STR'],arrows:[]}
];
let PATH='S';let STEPS=[],MAIN=0,SUM=null;

// summary step
function applyPath(){STEPS=ALL.filter(s=>!s.path||s.path==PATH).map((s,k)=>Object.assign({},s,{n:String(k+1)}));MAIN=STEPS.length;
SUM={summary:true,origin:{},who:null,title:'Ringkasan: seluruh alur',text:'Semua peran dalam satu gambar. Angka = urutan langkah. ★ = pembuat dokumen. Tekan Sebelumnya untuk melihat alur panahnya lagi.',roles:{},nums:{},arrows:[]};
STEPS.forEach(s=>{if(s.branch)return;if(s.icons){SUM.icons=SUM.icons||{};for(const g in s.icons){SUM.icons[g]=Object.assign(SUM.icons[g]||{},s.icons[g]);}}for(const g in s.roles){SUM.roles[g]=SUM.roles[g]||{};SUM.nums[g]=SUM.nums[g]||{};for(const n in s.roles[g]){
  const prev=SUM.roles[g][n],cur=s.roles[g][n];
  SUM.roles[g][n]=prev&&prev!==cur?(prev=='review'&&cur=='out'?'reviewout':cur=='comm'?prev:cur):cur;
  SUM.nums[g][n]=SUM.nums[g][n]?SUM.nums[g][n]+','+s.n:s.n;}}});

}
applyPath();
function shapePath(t,w,h){const d=12,r=h/2;switch(t){
 case 'in':return `M${d},1 H${w-1} V${h-1} H${d} L1,${h/2} Z`;
 case 'out':return `M1,1 H${w-d} L${w-1},${h/2} L${w-d},${h-1} H1 Z`;
 case 'review':return `M${r},1 H${w-r} A${r-1},${r-1} 0 0 1 ${w-r},${h-1} H${r} A${r-1},${r-1} 0 0 1 ${r},1 Z`;
 case 'inreview':return `M${d},1 H${w-r} A${r-1},${r-1} 0 0 1 ${w-r},${h-1} H${d} L1,${h/2} Z`;
 case 'reviewout':return `M${r},1 H${w-d} L${w-1},${h/2} L${w-d},${h-1} H${r} A${r-1},${r-1} 0 0 1 ${r},1 Z`;
 case 'track':return `M9,1 H${w-d} L${w-1},${h/2} L${w-d},${h-1} H9 Q1,${h-1} 1,${h-9} V9 Q1,1 9,1 Z`;
 case 'inout':return `M${d},1 H${w-d} L${w-1},${h/2} L${w-d},${h-1} H${d} L1,${h/2} Z`;
 default:return `M8,1 H${w-8} Q${w-1},1 ${w-1},8 V${h-8} Q${w-1},${h-1} ${w-8},${h-1} H8 Q1,${h-1} 1,${h-8} V8 Q1,1 8,1 Z`;}}
const NS='http://www.w3.org/2000/svg';
function iconSVG(kind,size=24){const s=`<svg width="${size}" height="${size}" viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="50" fill="#111"/>`;
 const st='fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"';
 if(kind=='paidgreen')return `<svg width="${size}" height="${size}" viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="50" fill="#111417"/><text x="50" y="71" text-anchor="middle" font-family="Barlow Condensed,Arial Narrow,sans-serif" font-weight="800" font-size="66" fill="#fff">$</text></svg>`;
 if(kind=='okgreen')return `<svg width="${size}" height="${size}" viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="50" fill="#111417"/><path d="M28,52 L43,67 L73,34" fill="none" stroke="#fff" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
 if(kind=='ask')return s+`<g transform="translate(18,20) scale(.64)" fill="none" stroke="#fff" stroke-width="10" stroke-linejoin="round" stroke-linecap="round"><path d="M10,12 H90 V64 H44 L24,84 V64 H10 Z"/></g><path d="M36,42 H64" stroke="#fff" stroke-width="7" stroke-linecap="round"/></svg>`;
 if(kind=='stop')return s+`<path d="M35,16 H65 L84,35 V65 L65,84 H35 L16,65 V35 Z" fill="#fff"/><path d="M32,50 H68" stroke="#111" stroke-width="12" stroke-linecap="round"/></svg>`;
 if(kind=='play')return s+`<path d="M40,30 L72,50 L40,70 Z" fill="#fff" stroke="#fff" stroke-width="6" stroke-linejoin="round"/></svg>`;
 if(kind=='mega')return s+`<g transform="translate(16,16) scale(.68)" ${st}><path d="M12,40 H30 L68,18 V82 L30,60 H12 Z"/><path d="M30,60 L38,84"/><path d="M80,36 Q90,50 80,64"/></g></svg>`;
 if(kind=='dbl')return s+`<g transform="translate(14,16) scale(.72)" ${st}><path d="M8,54 L28,74 L60,32"/><path d="M44,70 L48,74 L90,28"/></g></svg>`;
 if(kind=='clock')return s+`<g transform="translate(18,16) scale(.64)" ${st}><circle cx="50" cy="55" r="31"/><path d="M50,55 V38 M50,55 L63,63 M30,84 L23,93 M70,84 L77,93 M14,30 A16,16 0 0 1 36,12 M64,12 A16,16 0 0 1 86,30"/></g></svg>`;
 return s+`<path d="M28,52 L44,68 L73,34" fill="none" stroke="#fff" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/></svg>`;}

const map=document.getElementById('map'),arrowsSvg=document.getElementById('arrows');
const LW=92,LH=34;
(function(){const src=(typeof ALL!=='undefined'?ALL:STEPS);const U=new Set();src.forEach(s=>{Object.keys(s.roles||{}).forEach(g=>U.add(g));Object.keys(s.icons||{}).forEach(g=>U.add(g));(s.arrows||[]).forEach(a=>{if(a.also)U.add(a.also);if(a.to)U.add(a.to);if(a.from)U.add(a.from[0]);if(a.toLab)U.add(a.toLab[0]);});if(s.comm)U.add(s.comm.at[0]);(s.focus||[]).forEach(g=>U.add(g));(s.track||[]).forEach(g=>U.add(g));});for(let i=GROUPS.length-1;i>=0;i--)if(!U.has(GROUPS[i].id))GROUPS.splice(i,1);})();
const COLS={GAMBAR:0,STR:1,ENG:2};const colEls=[0,1,2].map(()=>{const c=document.createElement('div');c.className='mcol';map.appendChild(c);return c;});
GROUPS.forEach(g=>{const d=document.createElement('section');d.className='group g-'+g.id+(g.unused?' unused':'')+(g.box?' boxonly':'');d.id='grp-'+g.id;
 d.style.setProperty('--gt',`var(${TINT[g.t][0]})`);d.style.setProperty('--gb',`var(${TINT[g.t][1]})`);
 d.innerHTML=`<h3 class="gname">${g.name}${g.unused?'<span style="font-weight:600;color:var(--muted)"> </span>':''}</h3><div class="labels"></div>`;
 const L=d.querySelector('.labels');
 g.m.forEach(n=>{const l=document.createElement('div');l.className='lab';l.id=`lab-${g.id}-${n}`;l.innerHTML=`<svg width="${LW}" height="${LH}" viewBox="0 0 ${LW} ${LH}"><path/></svg><span>${n}</span>`;L.appendChild(l);});
 colEls[COLS[g.id]].appendChild(d);});

 GROUPS.forEach(g=>{document.getElementById('grp-'+g.id).style.boxShadow='';});
 s.arrows.forEach(a=>{if(a.to&&!a.toLab){document.getElementById('grp-'+a.to).style.boxShadow=`0 0 0 3px ${sc(a.c)}`;}});
 orientSenders(s.arrows);
 drawArrows(s.arrows);
 const c=document.getElementById('card');const who=s.who;
 c.innerHTML=`<div class="meta"><span class="step-n">${s.summary?'Ringkasan':'Langkah '+s.n+' dari '+MAIN}${person!='SEMUA'?` · <b style="color:#E5534B">hanya langkah ${person} (${L.length})</b>`:''}</span>${who?[who].concat(s.also||[]).map(w=>`<span class="who" style="background:${P[w][0]};color:${P[w][1]}">${w}</span>`).join(''):''}<span class="dots">${L.map((_,k)=>`<span class="dot${k==idx?' on':''}"></span>`).join('')}</span></div>
 <h2>${s.title}</h2>${s.text?`<p>${s.text}</p>`:''}${s.comm&&!s.commOnly?`<div class="comm">${iconSVG(s.comm.icon,22)}<span>${s.comm.text}</span></div>`:''}
 <div class="nav">${L.length==1?`<button type="button" class="next" id="all">Lihat semua langkah</button>`:`<button type="button" id="prev" ${idx==0?'disabled':''}>Sebelumnya</button><button type="button" class="next" id="next">${idx==L.length-1?(person=='SEMUA'?'Mulai lagi':'Lihat semua langkah'):'Berikutnya'}</button>`}</div>`;
 const toAll=()=>{person='SEMUA';idx=0;pwrap.querySelectorAll('.pbtn').forEach(x=>x.setAttribute('aria-pressed',x.textContent=='Semua'));render(true);};
 if(L.length==1){document.getElementById('all').onclick=toAll;}
 else{document.getElementById('prev').onclick=()=>{idx--;render(true);};document.getElementById('next').onclick=()=>{if(idx<L.length-1){idx++;render(true);}else if(person=='SEMUA'){idx=0;render(true);}else toAll();};}
 if(scroll&&window.innerWidth<1020){const first=GROUPS.find(g=>active.has(g.id));const el=first&&document.getElementById('grp-'+first.id);
  if(el)el.scrollIntoView({block:'start',behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'});}}

// legend
const LG=[['out','Kirim (ujung = arah kirim)'],['review','Review'],['pas','Tidak ada tugas']];
document.getElementById('legend').innerHTML=`<span class="lg"><svg width="64" height="26" viewBox="0 0 64 26">${trackSVG(64,26,1)}</svg>Pak ARIEF memantau</span><span class="lg"><span class="badge" style="position:static;background:#F07D1A;color:#1a1000;width:22px;height:22px;display:inline-flex">★</span> Pembuat dokumen</span>`+LG.map(([t,cap])=>{const fill=t=='obs'?'var(--obs-fill)':t=='pas'?'var(--pas-fill)':'var(--surface)';const st=t=='pas'?'none':t=='obs'?'var(--obs-line)':'var(--ink)';
 return `<span class="lg"><svg width="64" height="26" viewBox="0 0 64 26"><path d="${shapePath(t=='obs'||t=='pas'?'plain':t,64,26)}" fill="${fill}" stroke="${st}" stroke-width="2"/></svg>${cap}</span>`;}).join('')+
 `<span class="lg"><svg width="22" height="26" viewBox="0 0 22 26"><path d="M2,2 H14 L20,8 V24 H2 Z M14,2 V8 H20" fill="var(--surface)" stroke="var(--ink)" stroke-width="2" stroke-linejoin="round"/></svg> Dokumen baru masuk WhatsApp</span><span class="lg">${iconSVG('okgreen',22)} Disetujui</span><span class="lg">${iconSVG('paidgreen',22)} Sudah dibayar</span><span class="lg">${iconSVG('clock',22)} Pengingat</span><span class="lg">${iconSVG('ask',22)} Permintaan</span><span class="lg">${iconSVG('stop',22)} STOP KERJA</span><span class="lg">${iconSVG('play',22)} LANJUT</span><span class="lg">${iconSVG('mega',22)} REVISI @all</span><span class="lg">${iconSVG('dbl',22)} DITERIMA</span><span class="lg">${iconSVG('check',22)} Selesai / OK</span>`;

document.addEventListener('keydown',e=>{if(e.target.closest&&e.target.closest('input,textarea'))return;const L=list();
 if(e.key=='ArrowRight'&&idx<L.length-1){idx++;render(true);}if(e.key=='ArrowLeft'&&idx>0){idx--;render(true);}});
let rt;window.addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>render(false),120);});
document.fonts&&document.fonts.ready.then(()=>render(false));
render(false);
</script>
